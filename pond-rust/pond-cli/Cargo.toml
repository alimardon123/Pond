[package]
name = "pond_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond CLI — the 'pond' command. Single binary, DuckDB philosophy."

[[bin]]
name = "pond"
path = "src/main.rs"

[dependencies]
pond_kernel = { path = "../pond-kernel" }
pond_storage = { path = "../pond-storage" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
