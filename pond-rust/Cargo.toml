[workspace]
resolver = "2"
members = ["pond-core", "pond-python"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Pond Contributors"]
repository = "https://github.com/zai/pond"
description = "Pond storage system — Rust core (PND2 + C ABI) and Python bindings"

# Workspace-level release profile — fast builds, optimized for FFI hot paths
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
