[workspace]
resolver = "2"
members = [
    "core/kernel",
    "core/storage",
    "core/codec",
    "core/arrow",
    "core/s3",
    "core/sql",
    "cli",
    "bindings/python/pyo3",
    "lenses/keyvalue/rust",
    "lenses/streaming/rust",
    "lenses/oltp/rust",
    "lenses/lakehouse/rust",
    "lenses/vector/rust",
    "extensions/indexes/ivf/rust",
    "extensions/indexes/hnsw/rust",
    "extensions/indexes/simple/rust",
    "extensions/semantic/base/rust",
    "extensions/semantic/ossie/rust",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Pond Contributors"]
repository = "https://github.com/alimardon123/Pond"
description = "Pond storage system — Rust core (kernel + storage + codec + arrow), CLI, language bindings"

# Workspace-level release profile — fast builds, optimized for FFI hot paths
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# NOTE: panic = "abort" would break tests (which need unwind to catch panics).
# We keep "unwind" for compatibility. The binary size difference is ~50KB.

# Shared dependencies available to all workspace members
[workspace.dependencies]
tempfile = "3"
rayon = "1"
