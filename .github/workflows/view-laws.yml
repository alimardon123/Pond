name: View Algebra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  view-laws:
    name: RFC-0007 View Algebra Property Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyarrow is required for the ArrowView adapter tests.
          # duckdb, polars, and pandas are tested when present (interop
          # tests gracefully skip if any are missing, but we install all
          # so the tests actually exercise the interop paths).
          pip install pyarrow duckdb polars pandas

      - name: Run view_laws.py CI harness (5 SDK Views)
        run: python pond-sdk/run_view_laws_ci.py

      - name: Run view_laws.py on ArrowView (Phase D adapter)
        run: python pond-arrow/run_arrow_view_laws.py

      - name: Run view_laws.py on external GraphView (Task 12 validation)
        run: python validation/run_graph_view_laws.py

      - name: Run ArrowView functional tests
        run: python pond-arrow/arrow_view.py

      - name: Run tombstone helper tests (RFC-0008)
        run: python pond-sdk/maintenance.py

      - name: Run Feature Store production tests (RFC-0011)
        run: python pond-feature-store/feature_store.py

      - name: Run Feature Store end-to-end ML workflow
        run: python pond-feature-store/e2e_workflow.py

      - name: Run ViewQuery tests (elegant cross-view reading)
        run: python pond-sdk/test_view_query.py
