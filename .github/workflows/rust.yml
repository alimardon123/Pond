name: Rust

# Every push, not just main. The gate that only runs on the default branch is
# the gate that finds a break after it has already landed — and every branch
# here is a development branch, so `branches: [main]` meant this workflow had
# never once run against the work in progress.
on:
  push:
  pull_request:

# A push and its pull request both fire. Superseding runs on the same ref are
# cancelled so a burst of commits costs one run, not one per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`. With `-D warnings`, a floating toolchain means a
      # new clippy release turns a green branch red with no code change: the
      # first run of this workflow failed on two `chunks_exact_to_as_chunks`
      # lints that did not exist in the version the tree was developed
      # against. Both were real and both were fixed — but a gate that changes
      # its own rules between runs is not a gate. Bump this deliberately, in
      # its own commit, and fix whatever the new release finds there.
      #
      # scripts/check.sh reads this exact line, so local and CI cannot
      # silently disagree about which compiler "passing" refers to.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Before anything expensive, and before anything can merge. A credential
      # that reaches a commit cannot be removed by a later commit — the value
      # stays in history — so the only useful place to catch one is here.
      - name: Secret scan
        run: ./scripts/secretscan.sh

      # Self-check: this file is one of the ones being parsed. A workflow that
      # does not parse fails before any job exists, which is indistinguishable
      # from a test failure in the runs list — so it is checked here too, and
      # in scripts/check.sh, where it is caught before the push.
      - name: Workflow lint
        run: |
          python3 -m pip install --quiet pyyaml
          python3 ./scripts/workflowlint.py

      # The CLI integration tests spawn the `pond` binary and resolve it via
      # CARGO_BIN_EXE_pond, which cargo sets for integration tests — no
      # separate release build is needed.
      - name: Build
        run: cargo build --workspace --all-targets

      # pond_python is included: `extension-module` is opt-in (maturin enables
      # it via pyproject.toml), so the test harness links against libpython
      # normally instead of failing on undefined Py* symbols.
      - name: Test
        run: cargo test --workspace

      # Style-only lints are allowed for now so the gate can be enforced today.
      # Ratchet these down over time rather than leaving clippy off entirely.
      #
      # pond_python is excluded from clippy only (it IS built and tested above).
      # It carries ~120 lints including 9 never-used functions — real dead code
      # worth removing, but that file is 6k lines and is slated for rework, so
      # it is tracked separately rather than blocking this gate.
      # The same gate developers run locally, so CI and a local check cannot
      # disagree about what passing means.
      - name: Clippy
        run: |
          cargo clippy --workspace --exclude pond_python --all-targets -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::needless_range_loop \
            -A clippy::large_enum_variant \
            -A clippy::len_without_is_empty \
            -A clippy::manual_range_contains \
            -A clippy::manual_strip \
            -A clippy::doc_lazy_continuation

  # Formatting is not enforced yet: `cargo fmt` would rewrite ~1100 hunks
  # across the existing tree. Run it as one dedicated commit, then promote
  # this to a required check.
  #
  # fmt:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #       with: { components: rustfmt }
  #     - run: cargo fmt --all --check
