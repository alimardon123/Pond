[package]
name = "pond_python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond — PyO3 bindings to Rust core (Python module name: pond)"

[lib]
name = "pond"                # import pond from Python
# `rlib` alongside `cdylib` so `cargo test` can build a test harness against
# this crate. `cdylib` alone produces only pond.so / .pyd / .dylib.
crate-type = ["cdylib", "rlib"]

[features]
default = ["s3", "zstd"]
s3 = ["dep:pond_s3"]
zstd = ["pond_core/zstd"]
# `extension-module` tells PyO3 not to link libpython — correct when building
# the .so that CPython dlopens, but it makes any standalone binary (including
# the `cargo test` harness) fail to link with undefined Py* symbols. It is
# therefore NOT enabled by default; maturin turns it on via pyproject.toml's
# `[tool.maturin] features`. This is what lets `cargo test --workspace`
# include this crate instead of having to exclude it.
extension-module = ["pyo3/extension-module"]

[dependencies]
pond_core = { path = "../../../core/codec", features = ["zstd"] }
pond_kernel = { path = "../../../core/kernel" }
pond_storage = { path = "../../../core/storage" }
pond_sql = { path = "../../../core/sql" }
pond_s3 = { path = "../../../core/s3", optional = true }
pond_ivf_index = { path = "../../../extensions/indexes/ivf/rust" }
pond_hnsw_index = { path = "../../../extensions/indexes/hnsw/rust" }
pond_simple_index = { path = "../../../extensions/indexes/simple/rust" }
pond_semantic = { path = "../../../extensions/semantic/base/rust" }
pond_ossie_adapter = { path = "../../../extensions/semantic/ossie/rust" }
pyo3 = { version = "0.22" }
serde_json = "1"
rayon = "1"
