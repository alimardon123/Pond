[package]
name = "pond_python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond storage — PyO3 bindings to bindings/python/core (Python module name: pond_rust)"

[lib]
name = "pond_rust"           # import pond_rust from Python
crate-type = ["cdylib"]      # produces pond_rust.so / .pyd / .dylib

[dependencies]
pond_core = { path = "../../../core/codec" }
pyo3 = { version = "0.22", features = ["extension-module"] }
