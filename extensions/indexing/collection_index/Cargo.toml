[package]
name = "pond_collection_index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CollectionIndexer — secondary indexes for Pond collections"

[lib]
name = "pond_collection_index"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pond_kernel = { path = "../../../core/kernel" }
pond_storage = { path = "../../../core/storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
