[package]
name = "pond_sql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond SQL engine — pure-Rust SQL parser and executor"

[lib]
name = "pond_sql"
crate-type = ["rlib"]

[dependencies]
pond_core = { path = "../codec" }
pond_kernel = { path = "../kernel" }
pond_storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
