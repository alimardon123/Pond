[package]
name = "pond_kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond storage kernel — the 3 primitives (Write, Read, Ref) in pure Rust, with local FS backend"

[lib]
name = "pond_kernel"
# rlib:      Rust crate (used by pond-cli and other Rust crates)
# staticlib: C ABI static library (.a) for linking into Go/Java/Node/C
# cdylib:    shared library (.so/.dylib/.dll) for dynamic FFI
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# `async` is OPT-IN. When enabled, exposes:
#   - `AsyncObjectStore` trait (put_blob_async, get_blob_async, ...)
#   - `PondKernel::{write_async, read_blob_async, read_async, ...}`
# Implemented with `tokio::task::spawn_blocking` so the sync API stays usable
# from async contexts (no duplicate code path for object-store logic).
# The sync API is unchanged when this feature is OFF (the default).
async = ["dep:tokio", "dep:async-trait"]

[dependencies]
# The kernel keeps its dependency set deliberately tiny — every crate here has
# to be satisfiable by every consumer of the single-binary distribution.
sha2 = "0.10"
# OS CSPRNG for UUIDv7 randomness. Already present transitively (ring/TLS),
# so this adds no new third-party surface.
getrandom = "0.3"

# Optional async I/O. Only pulled in with `--features async`.
tokio = { version = "1", features = ["rt", "fs", "io-util"], optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# tokio with macros + test macro so we can `#[tokio::test]` async tests.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util"] }
