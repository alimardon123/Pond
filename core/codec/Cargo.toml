[package]
name = "pond_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond storage — pure-Rust PND2 codec + C ABI for cross-language SDK bindings (Go, Java, Node, C, C++, Zig)"

[lib]
name = "pond_core"
# staticlib: C ABI static library (.a/.lib) for linking into Go/Java/Node/C/C++/Zig
# rlib:      Rust crate so pond-python (and other Rust crates) can depend on it
# cdylib:    shared library (.so/.dylib/.dll) for dynamic FFI loading
crate-type = ["staticlib", "rlib", "cdylib"]

[features]
default = []
# Enable zstd decompression support (for reading production PND2 blobs).
# Uses ruzstd (pure-Rust, no C deps). Off by default to preserve zero-dep
# for cross-language linking. Enable with: cargo build -p pond_core --features zstd
zstd = ["dep:ruzstd"]

[dependencies]
# NONE by default — pond_core stays pure-Rust with zero external deps.
# This is critical for cross-language linking: consumers (Go, Java, Node)
# must not have to satisfy transitive Rust crate dependencies.
ruzstd = { version = "0.9", optional = true }
