[package]
name = "pond_s3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S3-compatible object store for Pond — implements the ObjectStore trait"

[lib]
name = "pond_s3"
# rlib:      for use by pond_cli and other Rust crates
# staticlib: C ABI static library for cross-language linking
# cdylib:    shared library for dynamic FFI
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# `async` is OPT-IN. When enabled, exposes async S3 methods
# (`put_blob_async`, `get_blob_async`, `delete_blob_async`,
# `list_blobs_prefix_async`) on `S3ObjectStore` using `reqwest` instead of
# `ureq`. SigV4 signing is shared between sync and async paths.
#
# Enables `pond_kernel/async` so callers can build an async-capable kernel
# alongside async S3.
async = ["dep:reqwest", "dep:tokio", "pond_kernel/async"]

[dependencies]
pond_kernel = { path = "../kernel" }
pond_storage = { path = "../storage" }
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Needed to add a private/proxy CA to the trust store. rustls and webpki-roots
# are already in the tree via ureq; declaring them directly lets the client
# honour AWS_CA_BUNDLE / SSL_CERT_FILE, which is required to work behind a
# TLS-inspecting proxy or against a private S3 deployment.
# `ring` (not aws-lc-rs) to match the provider ureq already links, so the
# binary carries one crypto backend rather than two.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"

# Optional async I/O. Only pulled in with `--features async`.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# For async tests in the S3 crate (when the `async` feature is on).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
