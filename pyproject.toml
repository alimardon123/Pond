[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pond-storage"
version = "0.1.0"
description = "Unified content-addressed storage system — one copy of data, all workloads"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Pond Contributors"}]
keywords = ["storage", "content-addressed", "lakehouse", "vector-db", "streaming", "crdt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "zstandard>=0.23",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
lakehouse = ["pyarrow>=15.0", "duckdb>=1.0"]
test = ["pytest>=8.0", "moto>=5.0"]
dev = ["pyarrow>=15.0", "duckdb>=1.0", "boto3>=1.34", "pytest>=8.0", "moto>=5.0"]

[project.urls]
Homepage = "https://github.com/alimardon123/Pond"
Repository = "https://github.com/alimardon123/Pond"

[tool.setuptools.packages.find]
where = ["."]
include = ["pond*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
