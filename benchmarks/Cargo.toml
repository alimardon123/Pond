[package]
name = "pond_bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pond benchmarks — measures the storage claims against real object storage"
publish = false

[[bin]]
name = "writerscale"
path = "src/writerscale.rs"

[[bin]]
name = "r2_validation"
path = "src/r2_validation.rs"

[[bin]]
name = "r2_pagination"
path = "src/r2_pagination.rs"

[[bin]]
name = "nodesize"
path = "src/nodesize.rs"

[[bin]]
name = "adversarial"
path = "src/adversarial.rs"

[[bin]]
name = "valuesize"
path = "src/valuesize.rs"

[[bin]]
name = "spillpoint"
path = "src/spillpoint.rs"

[dependencies]
tempfile = { workspace = true }
pond_index = { path = "../core/index" }
pond_record = { path = "../core/record" }
pond_engine = { path = "../core/engine" }
pond_cache = { path = "../core/cache" }
pond_kernel = { path = "../core/kernel" }
pond_s3 = { path = "../core/s3" }
